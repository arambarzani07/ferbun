name: Publish Trivia unsigned IPA release

on:
  workflow_dispatch:
  push:
    branches: [trivia-mvp]
    paths:
      - .github/workflows/publish-unsigned-ipa.yml

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Download Trivia IPA artifact
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh run download 35714433509 --name Ferbun-Trivia-2.0.0-unsigned-ipa --dir dist
          sha256sum dist/Ferbun-Trivia-2.0.0-unsigned.ipa
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release create v2.0.0-trivia-unsigned dist/Ferbun-Trivia-2.0.0-unsigned.ipa \
            --target acd7536f51bcc010d35c548f9e02d8022c541416 \
            --title 'Fêrbûn Trivia 2.0.0 — unsigned iOS IPA' \
            --notes 'Unsigned iOS device build of the Fêrbûn Trivia MVP from branch trivia-mvp, commit acd7536f51bcc010d35c548f9e02d8022c541416. This IPA must be signed with a valid provisioning profile/certificate before installation on an iPhone.'
