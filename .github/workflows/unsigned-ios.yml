name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [trivia-mvp]
    paths:
      - .github/workflows/unsigned-ios.yml

permissions:
  contents: read

jobs:
  unsigned-ios:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate native iOS project
        env:
          CI: '1'
        run: npx expo prebuild --platform ios --no-install
      - name: Install CocoaPods
        run: |
          cd ios
          pod install
      - name: Build for physical iPhone without signing
        run: |
          set -euo pipefail
          WORKSPACE="$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)"
          test -n "$WORKSPACE"
          PROJECT="$(find ios -maxdepth 1 -name '*.xcodeproj' -print -quit)"
          test -n "$PROJECT"
          SCHEME="$(xcodebuild -list -json -project "$PROJECT" | python3 -c 'import json,sys; print(json.load(sys.stdin)["project"]["schemes"][0])')"
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release -destination 'generic/platform=iOS' -derivedDataPath "$PWD/build/derived" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          mkdir -p dist/Payload
          APP="$(find build/derived/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          if [ -z "$APP" ]; then
            echo 'No device .app was produced' >&2
            find build/derived/Build/Products -maxdepth 3 -type d -name '*.app'
            exit 1
          fi
          cp -R "$APP" dist/Payload/
          (cd dist && zip -q -r -y Ferbun-Trivia-2.0.0-unsigned.ipa Payload)
          unzip -t dist/Ferbun-Trivia-2.0.0-unsigned.ipa
          if codesign --verify --deep --strict "$APP" >/dev/null 2>&1; then
            echo 'Expected an unsigned application' >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Ferbun-Trivia-2.0.0-unsigned-ipa
          path: dist/Ferbun-Trivia-2.0.0-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
